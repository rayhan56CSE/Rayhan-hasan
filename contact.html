<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Rayhan Hasan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .contact-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .btn-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 12px;
            text-decoration: none !important;
            color: var(--text-color, #2c3e50);
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-card i {
            font-size: 1.4rem;
        }
        .btn-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .btn-card.email:hover { color: #ea4335; border-color: #ea4335; }
        .btn-card.github:hover { color: #2ea44f; border-color: #2ea44f; }
        .btn-card.linkedin:hover { color: #0077b5; border-color: #0077b5; }
        .btn-card.facebook:hover { color: #1877f2; border-color: #1877f2; }

        .email-display-box {
            margin-top: 30px;
            padding: 15px 20px;
            background-color: rgba(56, 189, 248, 0.08);
            border: 1px dashed var(--primary-color, #007bff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .email-text {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-color, #2c3e50);
        }
        .copy-btn {
            background-color: var(--primary-color, #007bff);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .copy-btn:hover {
            background-color: var(--primary-hover, #0056b3);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html">Rayhan Hasan</a></div>
        <div class="navbar-right">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="certificates.html">Certificates</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
        </div>
    </nav>

    <div class="container" style="margin-top: 40px;">
        <section class="card">
            <h2>Get In Touch</h2>
            <p style="margin-bottom: 20px; color: var(--text-muted, #666);">Feel free to connect with me through any of the platforms below:</p>

            <!-- Social Links Grid -->
            <div class="contact-card-grid">
                <!-- Browser Gmail Link -->
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=raihan56.hasan@gmail.com" target="_blank" class="btn-card email">
                    <i class="fas fa-envelope"></i>
                    <span>Send Email</span>
                </a>

                <!-- GitHub -->
                <a href="https://github.com/rayhan56CSE" target="_blank" class="btn-card github">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>

                <!-- LinkedIn -->
                <a href="https://linkedin.com/in/your-profile" target="_blank" class="btn-card linkedin">
                    <i class="fab fa-linkedin-in"></i>
                    <span>LinkedIn</span>
                </a>

                <!-- Facebook -->
                <a href="https://www.facebook.com/rayahana.hasana.211356" target="_blank" class="btn-card facebook">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </a>
            </div>

            <!-- Email Display & Easy Copy Box -->
            <div class="email-display-box">
                <div>
                    <i class="fas fa-at" style="color: var(--primary-color, #007bff); margin-right: 6px;"></i>
                    <span class="email-text" id="myEmail">raihan56.hasan@gmail.com</span>
                </div>
                <button class="copy-btn" onclick="copyEmail()"><i class="fas fa-copy"></i> Copy Email</button>
            </div>
        </section>
    </div>

    <footer>
        <p>Rayhan Hasan | Department of CSE</p>
    </footer>

    <script src="theme.js"></script>
    <script>
        function copyEmail() {
            const emailText = document.getElementById('myEmail').innerText;
            navigator.clipboard.writeText(emailText).then(() => {
                alert('Email address copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
